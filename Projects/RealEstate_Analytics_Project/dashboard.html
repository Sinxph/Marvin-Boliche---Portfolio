<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Management Analytics Overview</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-page: #fafaf9; --text-dark: #292524;
            --c-teal: #0f766e; --c-amber: #d97706; --c-stone: #a8a29e; 
        }

        * { font-family: 'Segoe UI', sans-serif; box-sizing: border-box; }
        body { margin: 0; background: var(--bg-page); color: var(--text-dark); }
        
        .top-nav {
            background-color: #ffffff; padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--c-teal);
        }
        .header-brand { display: flex; align-items: center; gap: 12px; }
        .logo-box { background: var(--c-teal); color: white; width: 40px; height: 40px; border-radius: 4px; display:flex; justify-content:center; align-items:center; font-weight:800; font-size:1.5rem;}
        .h-title { font-size: 1.4rem; font-weight: 700; color: #1c1917; margin: 0; }
        .h-sub { font-size: 0.8rem; color: #78716c; font-weight: 600; text-transform:uppercase; letter-spacing:1px; }

        .profile-badge { display:flex; align-items:center; gap:8px; font-weight: 700; color: #44403c; font-size:0.9rem;}
        .avatar { width:32px; height:32px; background: var(--c-teal); color:white; border-radius:50%; display:flex; justify-content:center; align-items:center; font-size:0.8rem;}

        .dash-container { padding: 2rem; max-width: 1400px; margin: 0 auto;}

        .filter-ribbon { padding-bottom: 1.5rem; display:flex; gap:10px; }
        .f-btn { background: white; border: 1px solid #d6d3d1; padding: 0.5rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: 600; color: #57534e; transition:0.2s;}
        .f-btn:hover { background: #f5f5f4; }
        .f-btn.active { background: var(--c-teal); color: white; border-color: var(--c-teal);}

        .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 2rem; }
        .kpi { padding: 1.5rem; border-radius: 8px; background: white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 6px solid #e7e5e4; cursor:pointer;}
        .kpi:hover { background: #fafaf9; }
        .k-title { font-size: 0.85rem; font-weight: 600; color: #57534e; margin-bottom: 0.5rem; text-transform: uppercase;}
        .k-val { font-size: 2.2rem; font-weight: 700; color: #1c1917; margin-bottom: 0.25rem;}
        
        .kpi-t { border-left-color: var(--c-teal); }
        .kpi-a { border-left-color: var(--c-amber); }

        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .card { background: white; border-radius: 8px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .c-wrap { flex-grow: 1; position: relative; min-height: 300px; display:flex; justify-content:center; align-items:center;}
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="header-brand">
            <div class="logo-box">R</div>
            <div>
                <h1 class="h-title">Texas Portfolio Analytics</h1>
                <div class="h-sub">Residential Property Management</div>
            </div>
        </div>
        <div class="profile-badge">
            <div class="avatar">MB</div>
            Marvin Boliche
        </div>
    </div>

    <div class="dash-container">
        <div class="filter-ribbon">
            <button class="f-btn active" onclick="setFilter(this)">All Metroplexes</button>
            <button class="f-btn" onclick="setFilter(this)">Austin Area</button>
            <button class="f-btn" onclick="setFilter(this)">DFW Metro</button>
            <button class="f-btn" onclick="setFilter(this)">Greater Houston</button>
        </div>

        <div class="kpi-row">
            <div class="kpi kpi-t"><div class="k-title">Total Properties Under Mgt</div><div class="k-val v-d">1,248</div></div>
            <div class="kpi kpi-t"><div class="k-title">Current Occupancy Rate</div><div class="k-val v-d" style="color:#0f766e;">92.4%</div></div>
            <div class="kpi kpi-a"><div class="k-title">Churn Risk (Notice Given)</div><div class="k-val v-d" style="color:#d97706;">6.1%</div></div>
            <div class="kpi kpi-t"><div class="k-title">Net Operating Income (MTD)</div><div class="k-val v-d">$1.4M</div></div>
        </div>

        <div class="chart-row">
            <div class="card"><div class="c-wrap"><canvas id="c1"></canvas></div></div>
            <div class="card"><div class="c-wrap"><canvas id="c2"></canvas></div></div>
        </div>
    </div>

    <script>
        Chart.defaults.font.family = "'Segoe UI', sans-serif";
        const charts = {};

        charts.c1 = new Chart(document.getElementById('c1'), {
            type: 'bar',
            data: { labels: ['Austin', 'Dallas', 'Houston', 'San Antonio'], datasets: [
                    { label: 'Occupied', data: [310, 420, 280, 148], backgroundColor: '#0f766e' },
                    { label: 'Vacant', data: [15, 22, 40, 13], backgroundColor: '#d97706' }
            ] },
            options: { responsive:true, maintainAspectRatio:false, scales:{x:{stacked:true},y:{stacked:true}} }
        });

        const genScatter = () => Array.from({length:60}, () => ({ x: Math.floor(Math.random()*2000)+500, y: Math.floor(Math.random()*2500)+800 }));

        charts.c2 = new Chart(document.getElementById('c2'), {
            type: 'scatter',
            data: { datasets: [{ label: 'Properties', data: genScatter(), backgroundColor: 'rgba(15, 118, 110, 0.6)', borderColor: '#0f766e', pointRadius: 4 }] },
            options: { responsive:true, maintainAspectRatio:false }
        });

        function setFilter(btn) {
            document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.querySelectorAll('.v-d').forEach((el, index) => {
                if(index === 0) el.innerHTML = Math.floor(Math.random() * 2000 + 400).toLocaleString();
                else if(index === 1) el.innerHTML = (Math.random() * 15 + 80).toFixed(1) + '%';
                else if(index === 2) el.innerHTML = (Math.random() * 8 + 2).toFixed(1) + '%';
                else if(index === 3) el.innerHTML = '$' + (Math.random() * 3 + 0.5).toFixed(1) + 'M';
            });

            charts.c1.data.datasets.forEach(d => {
                d.data = d.data.map(() => Math.floor(Math.random() * 500 + 20));
            });
            charts.c1.update();
            charts.c2.data.datasets[0].data = genScatter();
            charts.c2.update();
        }
    </script>
</body>
</html>
